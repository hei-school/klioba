<div th:fragment="clubCard(club)" class="club-card bg-white rounded-2xl shadow-sm border border-gray-100 p-5 sm:p-6 relative">
  <div class="flex items-center gap-3 sm:gap-4 mb-5">
    <div class="w-11 h-11 sm:w-14 sm:h-14 rounded-xl bg-gradient-to-br from-[#16163f] to-[#2a2a6e] flex items-center justify-center shrink-0 shadow-sm">
      <span class="material-icons text-white text-lg sm:text-2xl">groups</span>
    </div>
    <div class="min-w-0">
      <h3 class="text-sm sm:text-base font-bold text-[#16163f] leading-tight truncate" th:text="${club.name}">Club Name</h3>
      <span class="inline-flex items-center gap-1 text-xs text-gray-400 mt-0.5">
        <span class="material-icons text-xs">person</span>
        <span th:text="${#numbers.formatInteger(club.members, 0, 'COMMA') + ' membres'}">12 membres</span>
      </span>
    </div>
  </div>

  <div class="flex items-center justify-between gap-2">
    <div class="flex flex-col">
      <span class="text-[10px] sm:text-xs text-gray-400 font-medium">Trésorerie</span>
      <span class="text-base sm:text-lg font-bold text-[#16163f] mt-0.5 truncate"
            th:text="${#numbers.formatInteger(club.remainingFund, 0, 'COMMA') + ' Ar'}">230,000 Ar</span>
    </div>
    <div class="flex items-center gap-3 border-l border-gray-100 pl-3 shrink-0">
      <div class="flex flex-col items-end gap-0.5">
        <span class="text-[10px] text-gray-400">Cotisations</span>
        <span class="text-[10px] sm:text-xs font-bold text-[#2E9A6F]"
              th:text="${#numbers.formatInteger(club.totalCotisations, 0, 'COMMA') + ' Ar'}">230,000 Ar</span>
      </div>
      <div class="flex flex-col items-end gap-0.5">
        <span class="text-[10px] text-gray-400">Dépenses</span>
        <span class="text-[10px] sm:text-xs font-bold text-[#E53E3E]"
              th:text="${#numbers.formatInteger(club.totalCotisations - club.remainingFund, 0, 'COMMA') + ' Ar'}">0 Ar</span>
      </div>
    </div>
  </div>

  <div class="flex gap-3 mt-5 pt-4 border-t border-gray-50">
    <a th:href="@{/club/{clubId}/membershipFee(clubId=${club.id})}"
       class="flex-1 bg-[#DFA408] hover:bg-[#c08f07] text-white text-xs sm:text-sm font-semibold py-2.5 sm:py-3 px-3 rounded-xl transition-all text-center">
      Payer la cotisation
    </a>
    <a th:href="@{/history/{clubId}(clubId=${club.id})}"
       title="Historique"
       class="w-10 h-10 sm:w-11 sm:h-10 flex items-center justify-center border border-gray-200 hover:border-[#DFA408] hover:text-[#DFA408] hover:bg-[#DFA408]/5 text-gray-500 rounded-xl transition-all">
      <span class="material-icons text-sm">history</span>
    </a>
  </div>
</div>
