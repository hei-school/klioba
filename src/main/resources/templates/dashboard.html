<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Klioba - Tableau de bord</title>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
      .stat-card {
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }
      .club-card {
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }
    </style>
  </head>

  <body class="bg-[#F4F5F7] min-h-screen text-gray-800">
    <div th:replace="fragments/header :: header"></div>

    <div class="container mx-auto px-4 sm:px-6 pt-6 sm:pt-10 pb-10 sm:pb-14">
      <!-- Page header -->
      <div
        class="bg-[#16163f] rounded-2xl p-6 sm:p-8 mb-8 shadow-lg"
      >
        <div
          class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4"
        >
          <div>
            <div class="flex items-center gap-3 mb-1">
              <div class="w-1.5 h-6 bg-[#DFA408] rounded-full"></div>
              <h1 class="text-xl sm:text-2xl font-bold text-white">
                Tableau de bord
              </h1>
            </div>
            <p class="text-gray-300 text-sm mt-1">
              Vue d'ensemble de la gestion des clubs
            </p>
          </div>
          <div
            class="flex items-center gap-3 bg-white/10 backdrop-blur-sm rounded-xl px-5 py-3"
          >
            <span class="material-icons text-[#DFA408]">calendar_month</span>
            <span
              class="text-white text-sm font-medium"
              th:text="${#dates.format(#dates.createNow(), 'dd MMM yyyy')}"
            ></span>
          </div>
        </div>
      </div>

      <!-- Stats cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
        <div
          class="stat-card bg-white rounded-2xl shadow-sm p-5 sm:p-6 flex flex-col"
        >
          <div class="flex items-center justify-between mb-3">
            <span
              class="text-gray-400 text-xs font-medium uppercase tracking-wider"
              >Trésorerie</span
            >
          </div>
          <p
            class="text-2xl sm:text-3xl font-bold text-[#DFA408]"
            th:text="${#numbers.formatInteger(totalRemaining, 0, 'COMMA') + ' Ar'}"
          >
            0 Ar
          </p>
          <p class="text-xs text-gray-400 mt-1">Fonds disponibles</p>
        </div>

        <div
          class="stat-card bg-white rounded-2xl shadow-sm p-5 sm:p-6 flex flex-col"
        >
          <div class="flex items-center justify-between mb-3">
            <span
              class="text-gray-400 text-xs font-medium uppercase tracking-wider"
              >Cotisations</span
            >
          </div>
          <p
            class="text-2xl sm:text-3xl font-bold text-[#DFA408]"
            th:text="${#numbers.formatInteger(totalCotisations, 0, 'COMMA') + ' Ar'}"
          >
            0 Ar
          </p>
          <p class="text-xs text-gray-400 mt-1">Total reçu</p>
        </div>

        <div
          class="stat-card bg-white rounded-2xl shadow-sm p-5 sm:p-6 flex flex-col"
        >
          <div class="flex items-center justify-between mb-3">
            <span
              class="text-gray-400 text-xs font-medium uppercase tracking-wider"
              >Dépenses</span
            >
          </div>
          <p
            class="text-2xl sm:text-3xl font-bold text-[#DFA408]"
            th:text="${#numbers.formatInteger(totalDepenses, 0, 'COMMA') + ' Ar'}"
          >
            0 Ar
          </p>
          <p class="text-xs text-gray-400 mt-1">Total dépensé</p>
        </div>

        <div
          class="stat-card bg-white rounded-2xl shadow-sm p-5 sm:p-6 flex flex-col"
        >
          <div class="flex items-center justify-between mb-3">
            <span
              class="text-gray-400 text-xs font-medium uppercase tracking-wider"
              >Membres</span
            >
          </div>
          <p
            class="text-2xl sm:text-3xl font-bold text-[#DFA408]"
            th:text="${#numbers.formatInteger(totalMembers, 0, 'COMMA')}"
          >
            0
          </p>
          <p class="text-xs text-gray-400 mt-1">Inscrits</p>
        </div>
      </div>

      <!-- Clubs section -->
      <div
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4"
      >
        <div class="flex items-center gap-3">
          <div class="w-1 h-6 bg-[#DFA408] rounded-full"></div>
          <h2 class="text-xl font-bold text-[#16163f]">Clubs</h2>
          <span
            class="text-xs text-gray-400 font-medium bg-gray-100 px-2.5 py-1 rounded-full"
            th:text="${#lists.size(clubs)} + ' clubs'"
          ></span>
        </div>
        <div
          class="w-full sm:w-72 bg-white rounded-xl border border-gray-200 shadow-sm flex items-center px-4 py-2.5 focus-within:ring-2 focus-within:ring-[#DFA408]/30 focus-within:border-[#DFA408] transition-all"
        >
          <span class="material-icons text-gray-400 text-sm mr-2">search</span>
          <input
            id="club-search"
            type="text"
            placeholder="Rechercher un club..."
            class="w-full bg-transparent border-none outline-none text-sm text-gray-700 placeholder-gray-400"
          />
        </div>
      </div>

      <div
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"
        id="club-grid"
      >
        <th:block th:each="club : ${clubs}">
          <div th:replace="fragments/club-card :: clubCard(club=${club})"></div>
        </th:block>
      </div>

      <div
        th:if="${not #lists.isEmpty(clubs)}"
        class="flex justify-center items-center gap-4 mt-8"
        id="club-pagination"
      >
        <button
          id="page-prev"
          class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 bg-white rounded-xl border border-gray-200 hover:border-[#DFA408] hover:text-[#DFA408] hover:bg-[#DFA408]/5 transition-all opacity-30 cursor-not-allowed pointer-events-none"
        >
          <span class="material-icons text-gray-600 text-sm sm:text-base"
            >chevron_left</span
          >
        </button>
        <span
          id="page-info"
          class="text-sm text-[#16163f] font-semibold w-20 text-center"
        ></span>
        <button
          id="page-next"
          class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 bg-white rounded-xl border border-gray-200 hover:border-[#DFA408] hover:text-[#DFA408] hover:bg-[#DFA408]/5 transition-all"
        >
          <span class="material-icons text-gray-600 text-sm sm:text-base"
            >chevron_right</span
          >
        </button>
      </div>

      <div id="no-search-results" class="text-center py-16 hidden">
        <div
          class="w-20 h-20 flex items-center justify-center mx-auto mb-4 bg-gray-100 rounded-2xl"
        >
          <span class="material-icons text-4xl text-gray-300">search_off</span>
        </div>
        <p class="text-gray-500 font-medium">
          Aucun club ne correspond à votre recherche
        </p>
      </div>

      <div th:if="${#lists.isEmpty(clubs)}" class="text-center py-16">
        <div
          class="w-20 h-20 flex items-center justify-center mx-auto mb-4 bg-gray-100 rounded-2xl"
        >
          <span class="material-icons text-4xl text-gray-300">groups</span>
        </div>
        <p class="text-gray-500 font-medium">Aucun club trouvé</p>
      </div>
    </div>

    <script src="/script/dashboard.js"></script>
  </body>
</html>
