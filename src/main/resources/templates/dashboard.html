<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Klioba - Tableau de bord</title>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:'Poppins',sans-serif}</style>
</head>

<body class="bg-[#F8F9FA] min-h-screen text-gray-800">

<div th:replace="fragments/header :: header"></div>

<div class="container mx-auto px-4 sm:px-6 pt-6 sm:pt-10 pb-10 sm:pb-14">

    <div class="mb-6">
      <h1 class="text-xl sm:text-2xl font-bold text-black">Tableau de bord</h1>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 mb-10">
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 sm:p-5 flex flex-col items-center text-center">
        <h3 class="text-gray-500 font-medium text-xs mb-1">Trésorerie totale</h3>
        <p class="text-xl sm:text-2xl font-bold text-[#16163f]"
           th:text="${#numbers.formatInteger(totalRemaining, 0, 'COMMA') + ' Ar'}">0 Ar</p>
      </div>
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 sm:p-5 flex flex-col items-center text-center">
        <h3 class="text-gray-500 font-medium text-xs mb-1">Cotisations reçues</h3>
        <p class="text-xl sm:text-2xl font-bold text-[#16163f]"
           th:text="${#numbers.formatInteger(totalCotisations, 0, 'COMMA') + ' Ar'}">0 Ar</p>
      </div>
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 sm:p-5 flex flex-col items-center text-center">
        <h3 class="text-gray-500 font-medium text-xs mb-1">Dépenses effectuées</h3>
        <p class="text-xl sm:text-2xl font-bold text-[#16163f]"
           th:text="${#numbers.formatInteger(totalDepenses, 0, 'COMMA') + ' Ar'}">0 Ar</p>
      </div>
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 sm:p-5 flex flex-col items-center text-center">
        <h3 class="text-gray-500 font-medium text-xs mb-1">Membres inscrits</h3>
        <p class="text-xl sm:text-2xl font-bold text-[#16163f]"
           th:text="${#numbers.formatInteger(totalMembers, 0, 'COMMA')}">0</p>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
      <h2 class="text-xl font-bold text-black">Clubs</h2>
      <div class="flex items-center gap-3">
        <div class="relative">
          <select id="active-filter" class="appearance-none bg-white rounded-lg border border-gray-200 shadow-sm pl-3 pr-8 py-2.5 text-sm text-gray-700 outline-none focus:border-gray-400 transition-all">
            <option value="all">Tous</option>
            <option value="true">Actif</option>
            <option value="false">Inactif</option>
          </select>
          <span class="material-icons absolute right-1.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none">unfold_more</span>
        </div>
        <div class="w-full sm:w-72 bg-white rounded-lg border border-gray-200 shadow-sm flex items-center px-4 py-2.5 focus-within:border-gray-400 transition-all">
          <span class="material-icons text-gray-400 text-sm mr-2">search</span>
          <input id="club-search" type="text" placeholder="Rechercher un club..." class="w-full bg-transparent border-none outline-none text-sm text-gray-700 placeholder-gray-400">
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4" id="club-grid">
      <th:block th:each="club : ${clubs}">
        <div th:replace="fragments/club-card :: clubCard(club=${club})"></div>
      </th:block>
    </div>

    <div th:if="${not #lists.isEmpty(clubs)}" class="flex justify-center items-center gap-4 mt-8" id="club-pagination">
      <button id="page-prev" class="flex items-center justify-center w-8 h-8 sm:w-10 sm:h-10 bg-white rounded-full shadow-md border border-gray-200 hover:bg-gray-50 transition-colors opacity-30 cursor-not-allowed pointer-events-none">
        <span class="material-icons text-gray-600 text-sm sm:text-base">chevron_left</span>
      </button>
      <span id="page-info" class="text-sm text-gray-500 font-medium w-20 text-center"></span>
      <button id="page-next" class="flex items-center justify-center w-8 h-8 sm:w-10 sm:h-10 bg-white rounded-full shadow-md border border-gray-200 hover:bg-gray-50 transition-colors">
        <span class="material-icons text-gray-600 text-sm sm:text-base">chevron_right</span>
      </button>
    </div>

    <div id="no-search-results" class="text-center py-16 hidden">
      <div class="bg-white rounded-full w-20 h-20 flex items-center justify-center mx-auto shadow-sm mb-4">
        <span class="material-icons text-4xl text-gray-300">search_off</span>
      </div>
      <p class="text-gray-500 font-medium">Aucun club ne correspond à votre recherche</p>
    </div>

    <div th:if="${#lists.isEmpty(clubs)}" class="text-center py-16">
      <div class="bg-white rounded-full w-20 h-20 flex items-center justify-center mx-auto shadow-sm mb-4">
        <span class="material-icons text-4xl text-gray-300">groups</span>
      </div>
      <p class="text-gray-500 font-medium">Aucun club trouvé</p>
    </div>

</div>

<script src="/script/dashboard.js"></script>

</body>
</html>
